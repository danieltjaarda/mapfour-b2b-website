<!doctype html>
<!-- Bron voor public/og.png (1200×630). Render met: node tools/og.mjs -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #111113; color: #fff; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; left: -160px; bottom: -330px; width: 760px; height: 760px; border-radius: 50%; filter: blur(70px); opacity: .75;
    background: radial-gradient(closest-side, #52b5c4 0%, rgba(82,181,196,.25) 55%, transparent 100%); }
  .dots { position: absolute; inset: 0; opacity: .07; background-image: radial-gradient(rgba(255,255,255,.7) .6px, transparent .6px); background-size: 22px 22px; }
  .logo { position: absolute; left: 72px; top: 64px; height: 34px; display: flex; align-items: center; gap: 16px; }
  .logo img { height: 34px; }
  .logo span { height: 22px; width: 1px; background: rgba(255,255,255,.3); }
  .logo b { font-weight: 500; font-size: 22px; color: rgba(255,255,255,.7); }
  h1 { position: absolute; left: 72px; top: 196px; margin: 0; width: 560px; font-size: 64px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; }
  p { position: absolute; left: 72px; top: 420px; margin: 0; width: 520px; font-size: 24px; line-height: 1.4; color: rgba(255,255,255,.65); }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; font-size: 17px; }
  .chips span { padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .bike { position: absolute; right: 30px; top: 150px; width: 600px; filter: drop-shadow(0 40px 40px rgba(0,0,0,.55)); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="dots"></div>
  <div class="logo"><img src="../public/logo-white.svg" alt=""><span></span><b>B2B</b></div>
  <h1>E-bikes for dealers.</h1>
  <p>Carbon city, full-suspension trekking and folding utility e-bikes.</p>
  <div class="chips"><span>City</span><span>Trekking</span><span>Utility</span></div>
  <img class="bike" src="../public/images/bikes/roam-midnight-blue.webp" alt="">
</body>
</html>
